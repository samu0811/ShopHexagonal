<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorías')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Categorías</h2>
        <a class="btn btn-primary" th:href="@{/categorias/nuevo}">Nueva categoría</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th style="width: 260px;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.descripcion}"></td>
            <td>
                <a class="btn btn-sm btn-info" th:href="@{/categorias/{id}(id=${c.id})}">Ver</a>
                <a class="btn btn-sm btn-warning" th:href="@{/categorias/editar/{id}(id=${c.id})}">Editar</a>
                <form class="d-inline" th:action="@{/categorias/eliminar/{id}(id=${c.id})}" method="post"
                      onsubmit="return confirm('¿Eliminar esta categoría?');">
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categorias)}">
            <td colspan="4" class="text-center text-muted">No hay categorías registradas</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
