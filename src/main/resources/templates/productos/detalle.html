<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de producto')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<div class="container" style="max-width: 800px;">
    <h2>Detalle del producto</h2>

    <div class="row">
        <div class="col-md-8">
            <dl class="row">
                <dt class="col-sm-4">Código</dt>
                <dd class="col-sm-8" th:text="${producto.codigo}"></dd>
                <dt class="col-sm-4">Nombre</dt>
                <dd class="col-sm-8" th:text="${producto.nombre}"></dd>
                <dt class="col-sm-4">Descripción</dt>
                <dd class="col-sm-8" th:text="${producto.descripcion}"></dd>
                <dt class="col-sm-4">Categoría</dt>
                <dd class="col-sm-8" th:text="${producto.categoria.nombre}"></dd>
                <dt class="col-sm-4">Marca</dt>
                <dd class="col-sm-8" th:text="${producto.marca}"></dd>
                <dt class="col-sm-4">Talla</dt>
                <dd class="col-sm-8" th:text="${producto.talla}"></dd>
                <dt class="col-sm-4">Color</dt>
                <dd class="col-sm-8" th:text="${producto.color}"></dd>
                <dt class="col-sm-4">Precio</dt>
                <dd class="col-sm-8" th:text="${#numbers.formatDecimal(producto.precio, 1, 'POINT', 2, 'COMMA')}"></dd>
                <dt class="col-sm-4">Cantidad disponible</dt>
                <dd class="col-sm-8" th:text="${producto.cantidadDisponible}"></dd>
            </dl>
        </div>
        <div class="col-md-4" th:if="${producto.imagenUrl != null and !#strings.isEmpty(producto.imagenUrl)}">
            <img class="img-fluid rounded" th:src="${producto.imagenUrl}" alt="Imagen del producto">
        </div>
    </div>

    <a class="btn btn-warning" th:href="@{/productos/editar/{id}(id=${producto.id})}">Editar</a>
    <a class="btn btn-secondary" th:href="@{/productos}">Volver</a>
</div>
</body>
</html>
