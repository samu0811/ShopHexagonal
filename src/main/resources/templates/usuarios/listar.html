<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Productos</h2>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Nuevo Usuario</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Documento</th>
            <th>Email</th>
            <th>Celular</th>
            <th style="width: 260px;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.documento}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.celular}"></td>
            <td>
                <a class="btn btn-sm btn-info" th:href="@{/usuarios/{id}(id=${u.id})}">Ver</a>
                <a class="btn btn-sm btn-warning" th:href="@{/usuarios/editar/{id}(id=${u.id})}">Editar</a>
                <form class="d-inline" th:action="@{/usuarios/eliminar/{id}(id=${u.id})}" method="post"
                      onsubmit="return confirm('¿Eliminar este usuario?');">
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="9" class="text-center text-muted">No hay usuarios registrados</td>
        </tr>
        </tbody>
    </table>
    <a class="btn btn-secondary" th:href="@{/}">Volver</a>
</div>
</body>
</html>
