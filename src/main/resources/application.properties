#Nombre de la aplicacion
spring.application.name=tienda-ropa-mvc

#conexion mysql createDatabaseIfNotExist=true
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_ropa_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hibernate crea/actualiza la base de datos automaticamente segun las entidades de java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#Puerto
server.port=8080
